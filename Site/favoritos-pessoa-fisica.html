<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos | Usinalink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-user-role="pessoa_fisica">
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-icon">US</span><span>Usinalink</span></a>
      <nav class="side-nav" data-role-nav="pessoa_fisica"></nav>
    </aside>
    <main class="app-main">
      <div class="page-header">
        <div><span class="eyebrow">Salvos</span><h1>Favoritos</h1><p>Pe&ccedil;as e usinas que voc&ecirc; marcou para ver depois.</p></div>
      </div>
      <section class="card table-card" data-search-scope>
        <div class="quick-filters">
          <button class="filter-pill active" type="button" data-fav-filtro="todos">Todos</button>
          <button class="filter-pill" type="button" data-fav-filtro="peca">Pe&ccedil;as</button>
          <button class="filter-pill" type="button" data-fav-filtro="usina">Usinas</button>
        </div>
        <div class="order-card-grid" data-favoritos><div class="loading-state">Carregando...</div></div>
      </section>
    </main>
  </div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/pf-common.js"></script>
  <script src="assets/js/pf-nav.js"></script>
  <script src="assets/js/favoritos-pessoa-fisica.js"></script>
  <script src="script.js"></script>
</body>
</html>
