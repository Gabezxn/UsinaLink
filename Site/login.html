<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Login conta registrada na Usinalink, marketplace B2B de peças industriais que conecta empresas, usinas e compradores.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<body class="auth-page">

    <a class="brand auth-brand" href="index.html">
      <span class="brand-icon" aria-hidden="true"><svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2.5l8 4.5v10l-8 4.5-8-4.5V7z"/><circle cx="12" cy="12" r="3.2"/></svg></span>

      <p>Selecione o tipo da sua conta pra continuar.</p>
      <div class="choice-grid" role="group" aria-label="Tipo de conta">
        <a class="choice-card active" href="login-empresa.html"><span class="choice-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21V5l8-2v18M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"/></svg></span><strong>Empresa</strong><small>Compras e solicitações</small></a>

      </div>
      <a class="text-link centered" href="cadastro.html">Criar nova conta</a>
    </section>

  <script src="assets/js/a11y.js" defer></script>
