<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login conta registrada | Usinalink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-icon" aria-hidden="true">US</span>
      <span>Usinalink</span>
    </a>
    <section class="card auth-card">
      <h1>Entrar numa conta já registrada</h1>
      <p>Selecione o tipo da sua conta pra continuar.</p>
      <div class="choice-grid" role="group" aria-label="Tipo de conta">
        <a class="choice-card active" href="login-empresa.html"><span class="choice-icon">EMP</span><strong>Empresa</strong><small>Compras e solicitações</small></a>
        <a class="choice-card blue" href="login-pessoa-fisica.html"><span class="choice-icon">PF</span><strong>Pessoa Física</strong><small>Acompanhamento individual</small></a>
        <a class="choice-card orange" href="login-usina.html"><span class="choice-icon">USI</span><strong>Usina</strong><small>Orçamentos industriais</small></a>
      </div>
      <a class="text-link centered" href="cadastro.html">Criar nova conta</a>
    </section>
  </main>
</body>
</html>
