<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pessoa Física | Usinalink</title>
  <meta name="description" content="Login Pessoa Física na Usinalink, marketplace B2B de peças industriais que conecta empresas, usinas e compradores.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/css/a11y.css">
  <script src="assets/js/safe-html.js"></script>
</head>
<body class="auth-page pf-mode">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-icon" aria-hidden="true"><svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2.5l8 4.5v10l-8 4.5-8-4.5V7z"/><circle cx="12" cy="12" r="3.2"/></svg></span>
      <span>Usinalink</span>
    </a>
    <section class="card auth-card">
      <h1>Entrar como pessoa física</h1>
      <p>Acesse sua conta do UsinaLink.</p>
      <form class="form js-login-form" data-login-type="pessoa_fisica" data-redirect="dashboard-pessoa-fisica.html" novalidate>
        <label class="field">
          <span>E-mail</span>
          <div class="input-icon"><span aria-hidden="true">@</span><input id="login-pessoa-email" name="email" type="email" autocomplete="username" placeholder="usuario@email.com" required></div>
        </label>
        <label class="field">
          <span>Senha</span>
          <div class="input-icon"><span aria-hidden="true">*</span><input id="login-pessoa-senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required></div>
        </label>
        <button class="btn full" type="submit">Entrar</button>
      </form>
      <a class="text-link centered" href="esqueci-senha.html">Esqueci minha senha</a>
      <a class="text-link centered" href="cadastro.html?tipo=pessoa_fisica">Criar nova conta</a>
    </section>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="script.js"></script>
  <script src="assets/js/a11y.js" defer></script>
</body>
</html>
